server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:./camunda-h2-database
    username: sa
    password: sa

camunda:
  bpm:
    admin-user:
      id: demo
      password: demo
      first-name: Demo
    filter:
      create: All tasks
    # Despliega los BPMN, las tablas DMN y los formularios Camunda Forms (.form)
    deployment-resource-pattern:
      - classpath*:bpmn/*.bpmn
      - classpath*:dmn/*.dmn
      - classpath*:forms/*.form

# Los workers en JavaScript (carpeta workers-js) usan http://localhost:8080/engine-rest

logging:
  level:
    com.utllanoalianza: INFO
